<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Falafelinhotpot</title>

  <meta name="theme-color" content="#f5ece0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:title" content="Falafelinhotpot" />
  <meta name="author" content="Falafelinhotpot" />

  <meta property="og:site_name" content="Falafelinhotpot" />

  <meta property="og:description" content="Bridging Chinese and Arab cultures" />
  <meta property="og:image" content="https://links.falafelinhotpot.com/images/jpg/profile.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://links.falafelinhotpot.com/images/jpg/profile.jpg" />
  <meta name="twitter:title" content="Falafelinhotpot" />

  <link rel="apple-touch-icon" sizes="180x180" href="./png/apple-touch-icon.png">
  <link rel="shortcut icon" href="./favicon.ico">

  <link rel="preload" as="image" href="./images/jpg/profile.webp" type="image/webp" fetchpriority="high" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.lordicon.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"></noscript>

  <script src="https://cdn.lordicon.com/lordicon.js" defer></script>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <canvas id="ink-atmosphere" aria-hidden="true"></canvas>

  <main id="main" class="container">

    <!-- Tier 1: Profile -->
    <header class="profile glass-card" data-animate="fade-up">
      <div class="profile__frame">
        <picture>
          <source srcset="./images/jpg/profile.webp" type="image/webp" />
          <img src="./images/jpg/profile.jpg" alt="Falafelinhotpot" width="120" height="120" class="profile__image" />
        </picture>
        <span class="profile__corner profile__corner--tl" aria-hidden="true"></span>
        <span class="profile__corner profile__corner--tr" aria-hidden="true"></span>
        <span class="profile__corner profile__corner--bl" aria-hidden="true"></span>
        <span class="profile__corner profile__corner--br" aria-hidden="true"></span>
      </div>
      <h1 class="profile__name" translate="no">Falafelinhotpot</h1>
      <p class="profile__tagline">Bridging Chinese & Arab cultures</p>
      <div class="divider" aria-hidden="true"></div>
    </header>

    <!-- Tier 2: Featured Content -->
    <nav class="links" aria-label="Featured" data-animate="stagger">
      <a href="https://falafelinhotpot.com/mandarin-starterkit-course/" target="_blank" rel="noopener" class="link link--featured glass-card" data-animate-child>
        <span class="link__icon link__icon--featured" aria-hidden="true">
          <lord-icon class="current-color" src="https://cdn.lordicon.com/zyzoecaw.json" trigger="loop" delay="1500" target=".link--featured" stroke="bold" style="width:30px;height:30px"></lord-icon>
        </span>
        <span class="link__content">
          <span class="link__label">Mandarin Starterkit</span>
          <span class="link__sublabel">Start learning today</span>
        </span>
        <span class="link__arrow" data-icon="arrow-right" aria-hidden="true"></span>
      </a>

      <a href="https://falafelinhotpot.activehosted.com/f/1" target="_blank" rel="noopener" class="link link--guide glass-card" data-animate-child>
        <span class="link__icon" aria-hidden="true">
          <lord-icon class="current-color" src="https://cdn.lordicon.com/kezeezyg.json" trigger="hover" target=".link--guide" stroke="bold" style="width:30px;height:30px"></lord-icon>
        </span>
        <span class="link__content"><span class="link__label">FREE Guide to Chinese</span></span>
        <span class="link__arrow" data-icon="arrow-right" aria-hidden="true"></span>
      </a>

      <a href="https://falafelinhotpot.com/subscribe" target="_blank" rel="noopener" class="link link--newsletter glass-card" data-animate-child>
        <span class="link__icon" aria-hidden="true">
          <lord-icon class="current-color" src="https://cdn.lordicon.com/diihvcfp.json" trigger="hover" target=".link--newsletter" stroke="bold" style="width:30px;height:30px"></lord-icon>
        </span>
        <span class="link__content"><span class="link__label">Newsletter</span></span>
        <span class="link__arrow" data-icon="arrow-right" aria-hidden="true"></span>
      </a>

      <a href="https://www.falafelinhotpot.com/" target="_blank" rel="noopener" class="link link--website glass-card" data-animate-child>
        <span class="link__icon link__icon--logo" aria-hidden="true">
          <picture>
            <source srcset="./images/png/logo.webp" type="image/webp" />
            <img src="./images/png/logo.png" alt="" width="36" height="36" class="link__logo" />
          </picture>
        </span>
        <span class="link__content"><span class="link__label" translate="no">www.falafelinhotpot.com</span></span>
        <span class="link__arrow" data-icon="arrow-right" aria-hidden="true"></span>
      </a>
    </nav>

    <!-- Tier 3: Social Dock -->
    <section class="social-dock glass-card" data-animate="fade-up">
      <a href="https://www.instagram.com/falafelinhotpott/" target="_blank" rel="noopener" class="dock__icon" data-platform="instagram" title="Instagram">
        <span data-icon="instagram"></span>
        <span class="dock__label">Instagram</span>
      </a>
      <a href="https://www.tiktok.com/@falafelinhotpot" target="_blank" rel="noopener" class="dock__icon" data-platform="tiktok" title="TikTok">
        <span data-icon="tiktok"></span>
        <span class="dock__label">TikTok</span>
      </a>
      <a href="https://www.youtube.com/@falafelinhotpot" target="_blank" rel="noopener" class="dock__icon" data-platform="youtube" title="YouTube">
        <span data-icon="youtube"></span>
        <span class="dock__label">YouTube</span>
      </a>
      <a href="https://whatsapp.com/channel/0029Vb7mBywCxoAttPRlne0B" target="_blank" rel="noopener" class="dock__icon" data-platform="whatsapp" title="WhatsApp">
        <span data-icon="whatsapp"></span>
        <span class="dock__label">WhatsApp</span>
      </a>
      <a href="https://www.linkedin.com/company/falafel-in-hotpot/" target="_blank" rel="noopener" class="dock__icon" data-platform="linkedin" title="LinkedIn">
        <span data-icon="linkedin"></span>
        <span class="dock__label">LinkedIn</span>
      </a>
      <a href="https://community.falafelinhotpot.com/" target="_blank" rel="noopener" class="dock__icon" data-platform="community" title="Community">
        <span data-icon="community"></span>
        <span class="dock__label">Community</span>
      </a>
    </section>

    <footer class="footer" data-animate="fade-up">
      <p>&copy; 2026 <span translate="no">Falafelinhotpot</span></p>
    </footer>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
